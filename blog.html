<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Rahul Balakumar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Navigation Header -->
    <nav class="max-w-4xl mx-auto px-6 py-6 flex justify-between items-center border-b border-gray-800">
        <a href="index.html" class="font-bold text-lg hover:text-indigo-400">Rahul B.</a>
        <div class="space-x-6">
            <a href="index.html" class="hover:text-indigo-400">Home</a>
            <a href="blog.html" class="text-indigo-400 font-semibold">Blog</a>
            <a href="notes.html" class="hover:text-indigo-400">Notes</a>
        </div>
    </nav>

    <!-- Main Blog Section -->
    <main class="max-w-4xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-extrabold mb-8">Personal Blog</h1>
        
        <!-- Blog posts will dynamically load into this grid/container -->
        <div id="blog-posts-container" class="space-y-8">
            <p class="text-gray-400">Loading posts...</p>
        </div>
    </main>

    <!-- Script to Fetch and Render Posts -->
    <script>
      fetch('posts.json')
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById('blog-posts-container');
          container.innerHTML = ''; // Clear loading message

          if (data.posts.length === 0) {
            container.innerHTML = '<p class="text-gray-400">No posts found yet. Check back soon!</p>';
            return;
          }

          data.posts.forEach(post => {
            let mediaHTML = '';
            
            if (post.image && post.image.trim() !== '') {
              mediaHTML += `<img src="${post.image}" alt="${post.title}" class="rounded-lg w-full h-auto object-cover mb-4">`;
            }
            
            if (post.video && post.video.trim() !== '') {
              mediaHTML += `
                <div class="relative w-full aspect-video mb-4">
                  <iframe src="${post.video}" class="absolute top-0 left-0 w-full h-full rounded-lg" frameborder="0" allowfullscreen></iframe>
                </div>`;
            }

            const postHTML = `
              <article class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-lg">
                <h2 class="text-2xl font-bold text-white mb-2">${post.title}</h2>
                <p class="text-xs text-indigo-400 mb-4 font-mono">${post.date}</p>
                <p class="text-gray-300 mb-6 leading-relaxed">${post.snippet}</p>
                ${mediaHTML}
              </article>
            `;
            container.innerHTML += postHTML;
          });
        })
        .catch(error => {
          console.error('Error loading posts:', error);
          document.getElementById('blog-posts-container').innerHTML = '<p class="text-red-400">Failed to load blog posts.</p>';
        });
    </script>
</body>
</html>
